name: Deploy to Azure

# Builds the Angular frontend and the .NET API, merges the Angular build into the
# API's wwwroot (same-origin hosting - no CORS needed in production), and deploys
# the result to the live Azure App Service. Runs on every push to develop.
on:
  push:
    branches: [develop]
  workflow_dispatch: {} # lets you trigger a redeploy manually from the Actions tab too

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular frontend (production)
        working-directory: tutorconnect-frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish TutorConnect.API/TutorConnect.API.csproj -c Release -o publish_output

      - name: Merge Angular build into wwwroot
        run: cp -r tutorconnect-frontend/dist/tutorconnect-frontend/browser/. publish_output/wwwroot/

      - name: Deploy to Azure App Service
        # Pinned to v2, not v3: v3's newer ARM-based resource auto-detection ("Failed
        # to get app runtime OS") misfires when only a publish-profile is supplied
        # (no OIDC/Azure login), and cascades into a false "Publish profile is
        # invalid" error even with a correct profile - a known issue with v3, not
        # something wrong with the profile itself. v2 skips that detection entirely.
        uses: azure/webapps-deploy@v2
        with:
          app-name: tutorconnect-api-steyn2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish_output
