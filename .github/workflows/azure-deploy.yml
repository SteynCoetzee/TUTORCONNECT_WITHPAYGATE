name: Deploy to Azure

# Builds the Angular frontend and the .NET API, merges the Angular build into the
# API's wwwroot (same-origin hosting - no CORS needed in production), and deploys
# the result to the live Azure App Service. Runs on every push to develop.
on:
  push:
    branches: [develop]
  workflow_dispatch: {} # lets you trigger a redeploy manually from the Actions tab too

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular frontend (production)
        working-directory: tutorconnect-frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish TutorConnect.API/TutorConnect.API.csproj -c Release -o publish_output

      - name: Merge Angular build into wwwroot
        run: cp -r tutorconnect-frontend/dist/tutorconnect-frontend/browser/. publish_output/wwwroot/

      - name: Zip publish output
        run: (cd publish_output && zip -r ../deploy.zip .)

      - name: Deploy to Azure App Service (clean)
        # Calls Kudu's OneDeploy API directly with clean=true, instead of the
        # azure/webapps-deploy marketplace action, for two reasons found the hard
        # way: (1) that action has no "clean" option at all, and Kudu's deploy is
        # incremental by default - it never wipes /home/site/wwwroot, so files from
        # an old deploy can linger alongside new ones. After adding several new NuGet
        # dependencies in one push, that once left a stale/mismatched assembly mixed
        # in with the new ones, causing a BadImageFormatException at runtime that only
        # a clean deploy fixed. (2) azure/webapps-deploy@v3's newer ARM-based resource
        # auto-detection ("Failed to get app runtime OS") misfires with only a
        # publish-profile (no OIDC/Azure login) and falsely reports "Publish profile is
        # invalid" even with a correct one - this sidesteps that entirely too.
        run: |
          PROFILE='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
          USERNAME=$(echo "$PROFILE" | grep -o 'userName="[^"]*"' | head -1 | sed 's/userName="//;s/"$//')
          PASSWORD=$(echo "$PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | sed 's/userPWD="//;s/"$//')
          curl -sf -X POST \
            -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://tutorconnect-api-steyn2026.scm.azurewebsites.net/api/publish?type=zip&clean=true&restart=true"
